name: update-libs
on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm libs:bump
      # A PR opened with GITHUB_TOKEN does not trigger ci.yml, so verify here before proposing the change.
      - run: pnpm test
      - run: pnpm build:libs
      - run: pnpm build
      - run: pnpm size
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-libs
          title: "chore(libs): update bundled libraries"
          commit-message: "chore(libs): update bundled libraries"
          body: |
            Weekly run of `pnpm libs:bump`: newest npm release of each library added as a pinned
            version (3 newest per major kept), hashes recomputed.
            The job already ran the unit tests, built the libraries and the extension, and checked
            the size budget with the new versions (a PR opened with GITHUB_TOKEN does not trigger ci.yml).
          add-paths: libraries.json
