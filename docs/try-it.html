<!doctype html>
<meta charset="utf-8">
<title>cdn-mirror try-it page</title>
<style>body{font:14px system-ui;margin:2rem;max-width:60rem}td,th{padding:.2rem .8rem;text-align:left}.ok{color:#080}.err{color:#b00}code{font-size:12px}</style>
<h1>cdn-mirror try-it page</h1>
<p>Serve it over http: <code>python3 -m http.server 8765 -d docs</code>, then open <code>http://localhost:8765/try-it.html</code>.
The toolbar badge and the popup should report <b id="expected">…</b> requests served locally (reload the page after loading the extension).</p>
<table><thead><tr><th>Library</th><th>Resource</th><th>Loaded</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const items = [
  ["jquery 3.7.1 (cdnjs)", "script", "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"],
  ["jquery 3.6.0 (jsDelivr)", "script", "https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"],
  ["jquery 3.4.1 (code.jquery.com)", "script", "https://code.jquery.com/jquery-3.4.1.min.js"],
  ["jquery-ui 1.13.3 (unpkg)", "script", "https://unpkg.com/jquery-ui@1.13.3/dist/jquery-ui.min.js"],
  ["bootstrap 5.3.3 css (jsDelivr)", "css", "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"],
  ["bootstrap 5.3.3 bundle (jsDelivr)", "script", "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"],
  ["bootstrap 4.6.2 css (cdnjs)", "css", "https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css"],
  ["bootstrap-icons 1.11.3 (jsDelivr)", "css", "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"],
  ["font-awesome 6.5.1 (cdnjs)", "css", "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"],
  ["animate.css 4.1.1 (cdnjs)", "css", "https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"],
  ["lodash 4.17.21 (unpkg)", "script", "https://unpkg.com/lodash@4.17.21/lodash.min.js"],
  ["axios 1.7.9 (jsDelivr)", "script", "https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"],
  ["moment 2.30.1 (jsDelivr)", "script", "https://cdn.jsdelivr.net/npm/moment@2.30.1/min/moment.min.js"],
  ["chart.js 4.4.7 (jsDelivr)", "script", "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"],
  ["d3 7.9.0 (unpkg)", "script", "https://unpkg.com/d3@7.9.0/dist/d3.min.js"],
  ["vue 3.5.13 (jsDelivr)", "script", "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"],
  ["react 18.3.1 (unpkg)", "script", "https://unpkg.com/react@18.3.1/umd/react.production.min.js"],
  ["htmx 2.0.4 (unpkg)", "script", "https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"],
];
document.getElementById("expected").textContent = items.length;
const rows = document.getElementById("rows");
for (const [name, kind, url] of items) {
  const tr = rows.insertRow();
  tr.innerHTML = `<td>${name}</td><td><code>${url}</code></td><td>…</td>`;
  const el = document.createElement(kind === "css" ? "link" : "script");
  if (kind === "css") el.rel = "stylesheet";
  el[kind === "css" ? "href" : "src"] = url;
  el.onload = () => { tr.cells[2].textContent = "yes"; tr.cells[2].className = "ok"; };
  el.onerror = () => { tr.cells[2].textContent = "failed"; tr.cells[2].className = "err"; };
  document.head.append(el);
}
</script>
